<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayblock</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="theme-color" content="#f3f2ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=shared-paper-15">
</head>
<body>

<header class="toolbar">
  <form id="catchallForm" class="catchall-form" autocomplete="off">
    <button type="button" id="toggleCatchall" aria-expanded="false" aria-controls="catchallDrawer">catchall</button>
    <input id="catchallInput" aria-label="Catchall note" placeholder="leave it here…">
    <button type="submit" aria-label="Save to catchall" title="Save to catchall">↵</button>
  </form>
  <section id="catchallDrawer" class="catchall-drawer" aria-label="Shared catchall" hidden></section>
  <button id="backShelf" aria-label="Bookshelf" title="Bookshelf">⌂</button>
  <div class="group date-controls">
    <button id="prev" title="previous spread (←)">‹</button>
    <button id="today">today</button>
    <button id="next" title="next spread (→)">›</button>
    <span id="range" class="range"></span>
  </div>

  <button id="toggleTools" aria-label="Planner settings" aria-expanded="false" aria-controls="plannerTools">⋯</button>
  <div id="plannerTools" class="planner-tools" hidden>
  <div class="group">
    <label>show
      <select id="view">
        <option value="all">all hours</option>
        <option value="work">work hours</option>
        <option value="off">off hours</option>
      </select>
    </label>
    <label class="hours">work
      <select id="ws"></select>
      <span class="dash">–</span>
      <select id="we"></select>
    </label>
  </div>

  <label class="past-hours-control"><input id="hidePastHours" type="checkbox"> hide past hours</label>
  <div class="group">
    <button id="addSticky">+ sticky note</button>
  </div>
  <section class="calendar-connection" aria-label="Google Calendar connection">
    <div><button id="connectCalendar" type="button">connect Google Calendar</button><button id="disconnectCalendar" type="button" hidden>disconnect</button></div>
    <p id="calendarStatus" role="status">Your primary calendar · read-only</p>
    <small id="calendarUpdated"></small>
    <a id="calendarSetup" href="https://github.com/k-ra/dayblock/blob/main/GOOGLE-CALENDAR.md" target="_blank" rel="noopener noreferrer" hidden>app setup</a>
  </section>
  </div>
  <div id="contextNavigation" class="context-navigation"></div>
  <div id="paperSections"></div>
  <div class="book-navigation">
    <nav class="book-tabs" aria-label="Planner view">
      <button data-mode="day">day</button><button data-mode="week">week</button><button data-mode="month">month</button>
    </nav>
    <nav class="paper-controls" aria-label="Paper layout">
      <button data-paper="page">page</button><button data-paper="spread">spread</button>
      <button id="toggleMargin" aria-pressed="false">margin</button>
    </nav>
  </div>
</header>

<section id="shelf" class="shelf" aria-label="Bookshelf"></section>
<main class="scene" id="scene">
  <p class="mobile-sheet-hint" id="mobileSheetHint" hidden>Swipe across the paper to see the rest →</p>
  <div class="book" id="book" tabindex="0" aria-label="Open notebook">
    <section class="page" data-side="left"></section>
    <section class="page" data-side="right"></section>
  </div>
  <div class="stationery" id="stationery"></div>
</main>

<div class="popover" id="popover"></div>

<script src="./calendar-config.js?v=book-first-11"></script>
<script src="./google-calendar.js?v=book-first-11"></script>
<script src="./planner-layout.js?v=book-first-11"></script>
<script src="./app.js?v=shared-paper-15"></script>
</body>
</html>
